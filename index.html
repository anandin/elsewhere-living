/* ---------- snap mode (?snap): one frozen frame for screenshot QA ----------
   The boot sequence starts the animation loop only after loadSplat() has
   resolved, and loadSplat awaits splat.initialized — so frames counted in
   loop() are post-initialization frames. After ~60 of them, copy the canvas
   into a static <img> laid over the stage (above the tint/vignette overlays),
   flag it in the title, and stop the loop so the page holds perfectly still. */
let snapFrames=0, snapTaken=false;
function takeSnap(){
  if(snapTaken) return; snapTaken=true;
  try{
    const img=document.createElement('img');
    img.id='snapimg';
    img.src=renderer.domElement.toDataURL('image/png');
    img.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:5;pointer-events:none;';
    stageEl.appendChild(img);
    const chip=document.createElement('div');
    chip.id='snapchip'; chip.textContent='SNAP';
    chip.style.cssText='position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:12;pointer-events:none;'+
      'background:#ffb45e;color:#3a2410;font-family:inherit;font-size:11px;font-weight:bold;letter-spacing:.14em;padding:3px 10px;border-radius:10px;';
    stageEl.appendChild(chip);
    document.title+=' · SNAP READY';
  }catch(e){ showError('snap failed: '+(e&&e.message||e)); }
  renderer.setAnimationLoop(null); // freeze either way — a still page is the point
}

/* ---------- main loop ---------- */
let lastMs=performance.now(), tintTimer=0;
function loop(){
  const now=performance.now();
  const dt=Math.min(0.05,(now-lastMs)/1000); lastMs=now;
  const t=now/1000;
  cam.idle+=dt;
  if(cam.idle>8&&!CAMQ.any&&!(typeof S!=="undefined"&&S&&S.speed===0)){
    // the window drifts, very slowly, when unwatched (never under a frozen
    // QA clock) — a gentle swing INSIDE the verified-safe arc around the
    // resting azimuth, so it can never wander into a hillside. If the
    // visitor has dragged the window outside that arc, drift leaves their
    // framing alone. A cam override pins the camera completely.
    if(cam.az>=CAM_AZ0-CAM_DRIFT-0.001&&cam.az<=CAM_AZ0+CAM_DRIFT+0.001){
      cam.az+=cam.dv*dt*0.006;
      if(cam.az>CAM_AZ0+CAM_DRIFT){ cam.az=CAM_AZ0+CAM_DRIFT; cam.dv=-1; }
      if(cam.az<CAM_AZ0-CAM_DRIFT){ cam.az=CAM_AZ0-CAM_DRIFT; cam.dv=1; }
    }
  }
  const target=new THREE.Vector3(CENTRE.x,CENTRE.y,CENTRE.z); // bowl centre at floor height (round-3, as measured)
  camera.position.set(
    target.x+cam.rad*Math.sin(cam.pol)*Math.sin(cam.az),
    target.y+cam.rad*Math.cos(cam.pol),
    target.z+cam.rad*Math.sin(cam.pol)*Math.cos(cam.az));
  camera.lookAt(target);
  updateActors(t,dt);
  animateLiving(t,dt);
  declutterLabels(dt);
  tintTimer+=dt;
  if(tintTimer>0.5){
    tintTimer=0;
    const mins=worldClock(nowWorld()).mins;
    tintEl.style.background=tintFor(mins);
    const nf=nightFactor(mins);
    updateFireflies(t,nf);
    // moonlight grade: cabinet turns indigo, the vignette breathes open,
    // and the figures' lights trade warm sun for cool moonlight so bodies
    // stay readable against the tinted splat (lights never touch the splat).
    scene.background.lerpColors(BG_DAY,BG_NIGHT,nf);
    vigEl.style.opacity=(1-nf*0.35).toFixed(3);
    hemi.intensity=1.5+nf*0.55;
    sun.intensity=2.1-nf*1.15;
    sun.color.lerpColors(SUN_DAY,SUN_NIGHT,nf);
    if(DEBUG) dumpDebug();
  }
  renderer.render(scene,camera);
  if(SNAP&&!snapTaken){ window.__snapFrames=++snapFrames; if(snapFrames>=SNAP_FRAMES) takeSnap(); }
}

/* ================= THE LIVING WORLD (transform, Nov 5) =================
   Anand walked the splat world and called it right: "no movement in the
   wind, a hazy look, no rivers flowing — a static 3D world." A splat is a
   photograph. So the life moves into REAL geometry grown over it:
   - a terrain skin sampled from the collider's own heights, so every
     cottage, figure and anchor stays planted exactly where it was;
   - a river carved along a curve from the castle hill, past the village,
     off the rim as a waterfall — real water, flowing by shader;
   - wind: instanced grass swaying in gusts, the puffball trees breathing,
     pollen motes drifting on the prevailing wind, clouds crossing the sky.
   The splat retires to what it is good at: sea and far backdrop. */
let living=null;
const WIND2=new THREE.Vector2(0.83,0.55).normalize();
const sstep=(a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
function hashN(x,z){ const s=Math.sin(x*127.1+z*311.7)*43758.5453; return s-Math.floor(s); }
function smoothN(x,z){
  const xi=Math.floor(x), zi=Math.floor(z), xf=x-xi, zf=z-zi;
  const u=xf*xf*(3-2*xf), v=zf*zf*(3-2*zf);
  return hashN(xi,zi)*(1-u)*(1-v)+hashN(xi+1,zi)*u*(1-v)+hashN(xi,zi+1)*(1-u)*v+hashN(xi+1,zi+1)*u*v;
}
function makeNoiseTexture(){
  const S=256, cv=document.createElement('canvas'); cv.width=cv.height=S;
  const ctx=cv.getContext('2d'), img=ctx.createImageData(S,S);
  const per=8;
  const tileN=(u,v,px,py)=>{ // tileable value noise on a wrapped lattice
    const xi=Math.floor(u), zi=Math.floor(v), xf=u-xi, zf=v-zi;
    const w=(a,b)=>hashN(((a%per)+per)%per*3.7+px, ((b%per)+per)%per*3.7+py);
    const uu=xf*xf*(3-2*xf), vv=zf*zf*(3-2*zf);
    return w(xi,zi)*(1-uu)*(1-vv)+w(xi+1,zi)*uu*(1-vv)+w(xi,zi+1)*(1-uu)*vv+w(xi+1,zi+1)*uu*vv;
  };
  for(let y=0;y<S;y++) for(let x=0;x<S;x++){
    const i=(y*S+x)*4;
    img.data[i]  =Math.floor(255*(tileN(x/S*per,y/S*per,0,0)*0.65+tileN(x/S*per*2,y/S*per*2,9,4)*0.35));
    img.data[i+1]=Math.floor(255*(tileN(x/S*per,y/S*per,31,7)*0.65+tileN(x/S*per*2,y/S*per*2,3,17)*0.35));
    img.data[i+2]=128; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const tx=new THREE.CanvasTexture(cv);
  tx.wrapS=tx.wrapT=THREE.RepeatWrapping;
  return tx;
}
function makeWaterMat(noiseTx, flow){
  return new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, side:THREE.DoubleSide,
    uniforms:{ uTime:{value:0}, uNoise:{value:noiseTx}, uFlow:{value:flow} },
    vertexShader:`
      varying vec2 vUv; varying vec3 vW;
      void main(){ vUv=uv; vec4 wp=modelMatrix*vec4(position,1.0); vW=wp.xyz;
        gl_Position=projectionMatrix*viewMatrix*wp; }`,
    fragmentShader:`
      uniform float uTime; uniform sampler2D uNoise; uniform float uFlow;
      varying vec2 vUv; varying vec3 vW;
      void main(){
        vec2 f1=vec2(vUv.x*1.6, vUv.y*0.85 - uTime*0.42*uFlow);
        vec2 f2=vec2(vUv.x*2.4+0.37, vUv.y*1.6 - uTime*0.71*uFlow);
        float n1=texture2D(uNoise,f1).r;
        float n2=texture2D(uNoise,f2).g;
        float rip=n1*0.6+n2*0.4;
        vec3 col=mix(vec3(0.06,0.22,0.30), vec3(0.35,0.65,0.69), rip);
        float sparkle=smoothstep(0.80,0.97,n1*n2*1.7);
        col+=sparkle*vec3(1.0,0.95,0.78)*0.85;
        float bank=smoothstep(0.30,0.485,abs(vUv.x-0.5));
        float foam=bank*smoothstep(0.52,0.78,rip);
        col=mix(col, vec3(0.93,0.97,0.96), foam*0.7);
        gl_FragColor=vec4(col, 0.93);
      }`
  });
}
function buildLivingWorld(){
  const H=FIG_H, E=PATCH_R*1.14;
  const group=new THREE.Group(); scene.add(group); window.__living=group;
  /* ---- the river's path: castle hill -> village -> rim ---- */
  const cs=window.__castleSpot;
  const hill=cs? new THREE.Vector2(cs.x,cs.z) : new THREE.Vector2(CENTRE.x-PATCH_R*0.5, CENTRE.z-PATCH_R*0.5);
  const inDir=new THREE.Vector2(CENTRE.x-hill.x, CENTRE.z-hill.y).normalize();
  const side=new THREE.Vector2(-inDir.y, inDir.x);
  const c2d=new THREE.Vector2(CENTRE.x, CENTRE.z);
  const path2=[
    hill.clone().addScaledVector(inDir, H*0.9),
    hill.clone().lerp(c2d,0.45).addScaledVector(side,H*0.8),
    c2d.clone().addScaledVector(side,H*1.7),
    c2d.clone().addScaledVector(inDir,PATCH_R*0.55).addScaledVector(side,H*0.6),
    c2d.clone().addScaledVector(inDir,PATCH_R*1.06)
  ];
  const curve=new THREE.CatmullRomCurve3(path2.map(p=>new THREE.Vector3(p.x,0,p.y)), false, 'catmullrom', 0.35);
  const RS=56, riverPts=[];
  for(let i=0;i<=RS;i++) riverPts.push(curve.getPoint(i/RS));
  const distRiver=(x,z)=>{
    let d=1e9;
    for(let i=0;i<riverPts.length-1;i++){
      const ax=riverPts[i].x, az=riverPts[i].z, bx=riverPts[i+1].x, bz=riverPts[i+1].z;
      const abx=bx-ax, abz=bz-az, t=Math.max(0,Math.min(1,((x-ax)*abx+(z-az)*abz)/((abx*abx+abz*abz)||1)));
      const dx=x-(ax+abx*t), dz=z-(az+abz*t), dd=dx*dx+dz*dz;
      if(dd<d) d=dd;
    }
    return Math.sqrt(d);
  };
  /* ---- coarse heights from the collider, nulls filled into a skirt ---- */
  const CN=60, coarse=[];
  for(let j=0;j<=CN;j++){ coarse.push([]);
    for(let i=0;i<=CN;i++){
      coarse[j].push(groundHeight(CENTRE.x-E+2*E*i/CN, CENTRE.z-E+2*E*j/CN));
    }
  }
  for(let pass=0;pass<CN;pass++){ let any=false;
    for(let j=0;j<=CN;j++) for(let i=0;i<=CN;i++){
      if(coarse[j][i]===null){ any=true; let s=0,n=0;
        for(const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){
          const row=coarse[j+dj]; const a=row?row[i+di]:null;
          if(a!==null&&a!==undefined){ s+=a; n++; }
        }
        if(n) coarse[j][i]=s/n-0.012*H;
      }
    }
    if(!any) break;
  }
  for(let j=0;j<=CN;j++) for(let i=0;i<=CN;i++) if(coarse[j][i]===null) coarse[j][i]=CENTRE.y-2.2*H;
  const sampleCoarse=(x,z)=>{
    const fx=Math.min(CN-0.001,Math.max(0,(x-(CENTRE.x-E))/(2*E)*CN));
    const fz=Math.min(CN-0.001,Math.max(0,(z-(CENTRE.z-E))/(2*E)*CN));
    const i=Math.floor(fx), j=Math.floor(fz), u=fx-i, v=fz-j;
    return coarse[j][i]*(1-u)*(1-v)+coarse[j][i+1]*u*(1-v)+coarse[j+1][i]*(1-u)*v+coarse[j+1][i+1]*u*v;
  };
  /* ---- the one true ground height of the living skin ---- */
  const RW=H*0.95, RD=H*0.34;
  const anchPts=Object.values(ANCH);
  const terrainH=(x,z)=>{
    let y=sampleCoarse(x,z);
    let aFade=1;
    for(const a of anchPts){ const d=Math.hypot(a.x-x,a.z-z); aFade=Math.min(aFade, Math.min(1,Math.max(0,(d-H*1.1)/(H*1.6)))); }
    y+=(smoothN(x*0.55,z*0.55)-0.5)*0.14*H*aFade+(smoothN(x*2.1+9,z*2.1+9)-0.5)*0.05*H*aFade;
    const d=distRiver(x,z);
    if(d<RW*1.9){
      let k=d<RW?1:1-(d-RW)/(RW*0.9); k=k*k*(3-2*k);
      const cFade=cs? sstep(H*0.5,H*2.4,Math.hypot(cs.x-x,cs.z-z)) : 1; // never undercut the castle
      y-=RD*k*cFade;
    }
    const rr=Math.hypot(x-CENTRE.x,z-CENTRE.z);
    y-=sstep(PATCH_R*1.02,PATCH_R*1.14,rr)*H*2.4;
    return y;
  };
  window.__terrainH=terrainH;
  /* ---- terrain mesh with painted vertex colours ---- */
  const FN=120, nv=(FN+1)*(FN+1);
  const pos=new Float32Array(nv*3), col=new Float32Array(nv*3), idx=[];
  const cA=new THREE.Color(0x74984a), cB=new THREE.Color(0xa9bf62), cRock=new THREE.Color(0x8a7f6d),
        cBank=new THREE.Color(0xc9b183), cBed=new THREE.Color(0x5f7040), cStone=new THREE.Color(0x9b8f7a), tmpC=new THREE.Color();
  for(let j=0;j<=FN;j++) for(let i=0;i<=FN;i++){
    const x=CENTRE.x-E+2*E*i/FN, z=CENTRE.z-E+2*E*j/FN, vi=j*(FN+1)+i;
    const y=terrainH(x,z)+0.035*H;
    pos.set([x,y,z],vi*3);
    const n1=smoothN(x*0.55,z*0.55);
    tmpC.copy(cA).lerp(cB,n1);
    const sl=Math.abs(terrainH(x+0.3,z)-y)+Math.abs(terrainH(x,z+0.3)-y);
    tmpC.lerp(cRock, Math.min(1,Math.max(0,(sl-0.16)/0.30))*0.8);
    const d=distRiver(x,z);
    if(d<RW*1.9){ const k=d<RW?1:1-(d-RW)/(RW*0.9);
      tmpC.lerp(cBank, (1-k)*0.55); tmpC.lerp(cBed, k*k*0.5); }
    if(y>CENTRE.y+H*1.9) tmpC.lerp(cStone,0.35);
    col.set([tmpC.r,tmpC.g,tmpC.b],vi*3);
    if(i<FN&&j<FN){ const a=vi,b=vi+1,c=vi+FN+1,d2=vi+FN+2; idx.push(a,c,b,b,c,d2); }
  }
  const tg=new THREE.BufferGeometry();
  tg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  tg.setAttribute('color',new THREE.BufferAttribute(col,3));
  tg.setIndex(idx); tg.computeVertexNormals();
  group.add(new THREE.Mesh(tg,new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.96,metalness:0})));
  /* ---- the water: a ribbon in the carved channel ---- */
  const noiseTx=makeNoiseTexture();
  const waterMats=[];
  const WN=64, wpos=[], wuv=[], widx=[];
  let vAcc=0; let prev=null;
  const wY=[];
  for(let i=0;i<=WN;i++){
    const p=curve.getPoint(i/WN);
    const tan=curve.getTangent(i/WN); const nx=-tan.z, nz=tan.x;
    const hw=H*(0.36+0.30*i/WN);
    const cy=terrainH(p.x,p.z)+RD*0.45+0.035*H;
    wY.push(cy);
    if(prev) vAcc+=Math.hypot(p.x-prev.x,p.z-prev.z)/(H*1.35);
    prev=p;
    wpos.push(p.x+nx*hw, cy, p.z+nz*hw, p.x-nx*hw, cy, p.z-nz*hw);
    wuv.push(0,vAcc, 1,vAcc);
    if(i<WN){ const a=i*2; widx.push(a,a+1,a+2, a+1,a+3,a+2); }
  }
  const wg=new THREE.BufferGeometry();
  wg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(wpos),3));
  wg.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(wuv),2));
  wg.setIndex(widx); wg.computeVertexNormals();
  const riverMat=makeWaterMat(noiseTx,1.0); waterMats.push(riverMat);
  group.add(new THREE.Mesh(wg,riverMat));
  /* ---- the waterfall off the rim + its mist ---- */
  const lip=curve.getPoint(1), lipTan=curve.getTangent(1);
  const fallH=H*3.1, lipY=wY[WN], hwF=H*0.62;
  const fnx=-lipTan.z, fnz=lipTan.x;
  const fpos=[
    lip.x+fnx*hwF, lipY, lip.z+fnz*hwF,  lip.x-fnx*hwF, lipY, lip.z-fnz*hwF,
    lip.x+fnx*hwF+lipTan.x*H*0.5, lipY-fallH, lip.z+fnz*hwF+lipTan.z*H*0.5,
    lip.x-fnx*hwF+lipTan.x*H*0.5, lipY-fallH, lip.z-fnz*hwF+lipTan.z*H*0.5];
  const fg=new THREE.BufferGeometry();
  fg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(fpos),3));
  fg.setAttribute('uv',new THREE.BufferAttribute(new Float32Array([0,0, 1,0, 0,3.2, 1,3.2]),2));
  fg.setIndex([0,1,2, 1,3,2]); fg.computeVertexNormals();
  const fallMat=makeWaterMat(noiseTx,2.3); waterMats.push(fallMat);
  group.add(new THREE.Mesh(fg,fallMat));
  const mist=[];
  const mistCv=document.createElement('canvas'); mistCv.width=mistCv.height=128;
  const mg=mistCv.getContext('2d'), mgrad=mg.createRadialGradient(64,64,4,64,64,62);
  mgrad.addColorStop(0,'rgba(255,255,255,0.85)'); mgrad.addColorStop(1,'rgba(255,255,255,0)');
  mg.fillStyle=mgrad; mg.fillRect(0,0,128,128);
  const mistTx=new THREE.CanvasTexture(mistCv);
  for(let i=0;i<6;i++){
    const sm=new THREE.SpriteMaterial({map:mistTx,transparent:true,opacity:0.3,depthWrite:false});
    const sp=new THREE.Sprite(sm);
    const bx=lip.x+lipTan.x*H*(0.4+Math.random()*0.5), bz=lip.z+lipTan.z*H*(0.4+Math.random()*0.5);
    sp.position.set(bx+(Math.random()-0.5)*H, lipY-fallH+H*0.25, bz+(Math.random()-0.5)*H);
    sp.scale.setScalar(H*(0.9+Math.random()*0.7));
    sp.userData.ph=Math.random()*6.28; sp.userData.base=sp.scale.x;
    group.add(sp); mist.push(sp);
  }
  /* ---- grass: a thousand tufts breathing with the wind ---- */
  const bladeH=H*0.34;
  const bg=new THREE.BufferGeometry();
  {
    const bp=[];
    for(let b=0;b<3;b++){
      const a=b/3*Math.PI, dx=Math.cos(a)*H*0.10, dz=Math.sin(a)*H*0.10;
      const px=-dz, pz=dx, w=H*0.045; // base half-width, perpendicular to the lean
      bp.push(-px*w,0,-pz*w, px*w,0,pz*w, dx,bladeH,dz); // one tapered triangle per blade
    }
    bg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(bp),3));
    bg.computeVertexNormals();
  }
  const grassMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:1,side:THREE.DoubleSide});
  let grassShader=null;
  grassMat.onBeforeCompile=(sh)=>{
    sh.uniforms.uTime={value:0};
    sh.vertexShader='uniform float uTime;\n'+sh.vertexShader.replace('#include <begin_vertex>',`
      #include <begin_vertex>
      {
        vec3 ipos=vec3(0.0);
        #ifdef USE_INSTANCING
          ipos=vec3(instanceMatrix[3][0],instanceMatrix[3][1],instanceMatrix[3][2]);
        #endif
        float ph=ipos.x*0.35+ipos.z*0.47;
        float sw=clamp(position.y/${bladeH.toFixed(3)},0.0,1.0);
        float gust=0.65+0.35*sin(uTime*0.4+ipos.x*0.08+ipos.z*0.05);
        transformed.x+=sin(uTime*1.9+ph)*${(0.085*H).toFixed(3)}*sw*gust;
        transformed.z+=cos(uTime*1.6+ph*1.3)*${(0.06*H).toFixed(3)}*sw*gust;
      }`);
    grassShader=sh;
  };
  grassMat.customProgramCacheKey=()=>'elves-grass';
  const GN=1500, grass=new THREE.InstancedMesh(bg,grassMat,GN);
  {
    const m4=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler(), sc=new THREE.Vector3(), pv=new THREE.Vector3();
    const gcol=new THREE.Color(); let placedG=0, guard=0;
    while(placedG<GN&&guard++<30000){
      const ang=Math.random()*Math.PI*2, r=Math.sqrt(Math.random())*PATCH_R*0.98;
      const x=CENTRE.x+Math.cos(ang)*r, z=CENTRE.z+Math.sin(ang)*r;
      if(distRiver(x,z)<RW*1.3) continue;
      let nearA=false; for(const a of anchPts){ if(Math.hypot(a.x-x,a.z-z)<H*1.05){ nearA=true; break; } }
      if(nearA) continue;
      if(cs&&Math.hypot(cs.x-x,cs.z-z)<H*2.3) continue;
      const y=terrainH(x,z);
      if(Math.abs(terrainH(x+0.4,z)-y)>0.30*H) continue;
      e.set(0,Math.random()*Math.PI,0); q.setFromEuler(e);
      const s=0.75+Math.random()*0.7; sc.set(s,s*(0.85+Math.random()*0.4),s);
      pv.set(x,y+0.03*H,z);
      m4.compose(pv,q,sc); grass.setMatrixAt(placedG,m4);
      gcol.setHSL(0.26+Math.random()*0.05,0.5,0.32+Math.random()*0.14);
      grass.setColorAt(placedG,gcol);
      placedG++;
    }
    grass.count=placedG;
  }
  group.add(grass);
  /* ---- the town trees, breathing ---- */
  const trees=[];
  if(window.__town){
    for(const ch of window.__town.children){
      if(ch.isGroup&&ch.children.length===3&&ch.children[0].geometry&&ch.children[0].geometry.type==='CylinderGeometry'){
        trees.push({g:ch, ph:Math.random()*6.28});
      }
    }
  }
  /* ---- pollen motes on the wind ---- */
  const MN=240, mPos=new Float32Array(MN*3), mSeed=new Float32Array(MN);
  for(let i=0;i<MN;i++){
    const ang=Math.random()*Math.PI*2, r=Math.sqrt(Math.random())*PATCH_R*0.92;
    const x=CENTRE.x+Math.cos(ang)*r, z=CENTRE.z+Math.sin(ang)*r;
    mPos.set([x, terrainH(x,z)+H*(0.3+Math.random()*1.7), z], i*3);
    mSeed[i]=Math.random()*20;
  }
  const mGeo=new THREE.BufferGeometry();
  mGeo.setAttribute('position',new THREE.BufferAttribute(mPos,3));
  const motes=new THREE.Points(mGeo,new THREE.PointsMaterial({size:H*0.055,map:mistTx,color:0xfff0b8,
    transparent:true,opacity:0.5,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true}));
  group.add(motes);
  /* ---- clouds crossing the sky ---- */
  const clouds=[];
  const clCv=document.createElement('canvas'); clCv.width=256; clCv.height=128;
  const cg=clCv.getContext('2d');
  for(const [bx,by,br] of [[80,74,52],[132,64,64],[184,76,50],[108,84,58],[160,86,44]]){
    const gr=cg.createRadialGradient(bx,by,4,bx,by,br);
    gr.addColorStop(0,'rgba(255,252,246,0.55)'); gr.addColorStop(1,'rgba(255,252,246,0)');
    cg.fillStyle=gr; cg.fillRect(0,0,256,128);
  }
  const clTx=new THREE.CanvasTexture(clCv);
  for(let i=0;i<5;i++){
    const sm=new THREE.SpriteMaterial({map:clTx,transparent:true,opacity:0.4+Math.random()*0.25,depthWrite:false});
    const sp=new THREE.Sprite(sm);
    const ang=Math.random()*Math.PI*2, r=Math.random()*PATCH_R*1.8;
    sp.position.set(CENTRE.x+Math.cos(ang)*r, CENTRE.y+H*(9+Math.random()*4), CENTRE.z+Math.sin(ang)*r);
    sp.scale.set(H*(7+Math.random()*5), H*(2.4+Math.random()*1.4), 1);
    group.add(sp); clouds.push(sp);
  }
  living={ waterMats, grassShaderRef:()=>grassShader, trees, motes, mPos, mSeed, clouds, mist, group };
}
function animateLiving(t, dt){
  if(!living) return;
  const H=FIG_H;
  for(const m of living.waterMats) m.uniforms.uTime.value=t;
  const gs=living.grassShaderRef();
  if(gs) gs.uniforms.uTime.value=t;
  for(const tr of living.trees){
    tr.g.rotation.z=Math.sin(t*1.25+tr.ph)*0.028;
    tr.g.rotation.x=Math.cos(t*1.05+tr.ph)*0.02;
  }
  const nf=nightFactor(worldClock(nowWorld()).mins);
  const pos=living.motes.geometry.attributes.position;
  for(let i=0;i<living.mSeed.length;i++){
    let x=pos.getX(i), y=pos.getY(i), z=pos.getZ(i);
    x+=(WIND2.x*0.5+Math.sin(t*0.7+living.mSeed[i])*0.14)*dt*H;
    z+=(WIND2.y*0.5+Math.cos(t*0.6+living.mSeed[i]*1.3)*0.14)*dt*H;
    y+=Math.sin(t*0.9+living.mSeed[i]*2.1)*0.10*dt*H;
    const dx=x-CENTRE.x, dz=z-CENTRE.z;
    if(dx*dx+dz*dz>PATCH_R*PATCH_R*0.92){
      x=CENTRE.x-WIND2.x*PATCH_R*0.9+(Math.random()-0.5)*H*3;
      z=CENTRE.z-WIND2.y*PATCH_R*0.9+(Math.random()-0.5)*H*3;
      y=terrainHWrap(x,z);
    }
    pos.setXYZ(i,x,y,z);
  }
  pos.needsUpdate=true;
  living.motes.material.opacity=0.5*(1-nf);
  living.motes.visible=nf<0.85;
  for(const c of living.clouds){
    c.position.x+=WIND2.x*dt*H*0.32;
    c.position.z+=WIND2.y*dt*H*0.32;
    const dx=c.position.x-CENTRE.x, dz=c.position.z-CENTRE.z;
    if(dx*dx+dz*dz>PATCH_R*PATCH_R*4.4){
      c.position.x=CENTRE.x-WIND2.x*PATCH_R*2.0+(Math.random()-0.5)*H*4;
      c.position.z=CENTRE.z-WIND2.y*PATCH_R*2.0+(Math.random()-0.5)*H*4;
    }
    c.material.opacity=(0.32+0.2*Math.sin(t*0.11+c.position.x*0.05))*(1-nf*0.65);
  }
  for(const sp of living.mist){
    const p=0.5+0.5*Math.sin(t*1.9+sp.userData.ph);
    sp.scale.setScalar(sp.userData.base*(0.85+0.35*p));
    sp.material.opacity=0.16+0.20*p;
  }
}
function terrainHWrap(x,z){ const f=window.__terrainH; return f? f(x,z)+FIG_H*0.8 : CENTRE.y+FIG_H; }

/* ---------- boot the stage ---------- */
window.__ground=(x,z)=>groundHeight(x,z);
window.__actors=actors;
window.__cam=cam;
window.__worldGroup=worldGroup;
window.__scene=scene;
window.__collider=()=>colliderObj;
(async()=>{
  try{
    const sem=await fetchSemantics();
    if(sem) applySemantics(sem);
    await Promise.all([loadCollider(),loadSplat('world_500k.spz')]); // rich splat by default: at eagle distance the 100k decimation turns cottages to mush
    worldGroup.updateMatrixWorld(true);
    discoverAnchors();
    buildActors();
    buildTown();
    buildFireflies();
    // buildLivingWorld() PARKED Nov 6: Anand's verdict on the transform was
    // "poor, meshed up graphics" — flat geometry laid over a painterly
    // photograph is two art languages fighting. The living systems stay in
    // the file for the one-style rebuild; the shipped world is the coherent
    // pre-transform build until that lands.
    cam.rad=CAMQ.rad!==null?CAMQ.rad:WORLD_SPAN*0.95; // eagle view: the whole settlement in one frame, sized to the loaded world
    layoutCamera();
    loadingEl.classList.add('done');
    renderer.setAnimationLoop(loop);
    if(DEBUG) dumpDebug();
  }catch(e){
    showError('stage failed: '+(e&&e.message||e));
    loadingEl.querySelector('div').textContent='The valley could not grow here.';
    loadingEl.querySelector('small').textContent=String(e&&e.message||e)+' — the inhabitants below still live; the window is the only thing missing.';
  }
})();
